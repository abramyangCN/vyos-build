name: Build custom VyOS (reusable)

on:
  workflow_call:
    inputs:
      include_dae:
        required: true
        type: boolean
      dae_version:
        required: false
        default: v2.1.1
        type: string
      dae_sha256:
        required: false
        default: ""
        type: string
      artifact_name:
        required: true
        type: string
      iso_name:
        required: true
        type: string
      version_label:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vyos-${{ inputs.artifact_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  KERNEL_BUNDLE_DIR: kernel-bundle

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out rolling
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force
          df -h

      - name: Pull the official VyOS build container
        run: docker pull vyos/vyos-build:rolling

      - name: Install deterministic validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kmod squashfs-tools
          command -v modinfo
          command -v unsquashfs

      - name: Restore signed kernel bundle
        id: kernel-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.KERNEL_BUNDLE_DIR }}
          key: ${{ runner.os }}-vyos-dae-intel82599-amd64-v3-${{ hashFiles('data/defaults.toml', 'data/certificates/**', 'scripts/package-build/linux-kernel/config/**', 'scripts/package-build/linux-kernel/common.sh', 'scripts/package-build/linux-kernel/build-kernel.sh', 'scripts/package-build/linux-kernel/build-intel-nic.sh', 'scripts/package-build/linux-kernel/sign-modules.sh', 'scripts/package-build/linux-kernel/build.py', 'scripts/package-build/linux-kernel/package.toml', 'scripts/package-build/linux-kernel/patches/**') }}

      - name: Build kernel and Intel 82599 drivers with one signing key
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            --sysctl net.ipv6.conf.lo.disable_ipv6=0 \
            -e GOSU_UID="$(id -u)" -e GOSU_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/vyos" \
            -w /vyos/scripts/package-build/linux-kernel \
            vyos/vyos-build:rolling \
            ./build.py --config package.toml \
              --packages linux-kernel ixgbe ixgbevf --keep-kernel

          mkdir -p "$KERNEL_BUNDLE_DIR"
          mapfile -t kernels < <(find scripts/package-build/linux-kernel -maxdepth 1 -type f \
            -name 'linux-image-[0-9]*_*.deb' ! -name '*-dbg_*' -print)
          mapfile -t ixgbe < <(find scripts/package-build/linux-kernel -maxdepth 1 -type f \
            -name 'vyos-intel-ixgbe_[0-9]*_*.deb' -print)
          mapfile -t ixgbevf < <(find scripts/package-build/linux-kernel -maxdepth 1 -type f \
            -name 'vyos-intel-ixgbevf_[0-9]*_*.deb' -print)
          [ "${#kernels[@]}" -eq 1 ]
          [ "${#ixgbe[@]}" -eq 1 ]
          [ "${#ixgbevf[@]}" -eq 1 ]
          cp -v "${kernels[0]}" "${ixgbe[0]}" "${ixgbevf[0]}" "$KERNEL_BUNDLE_DIR/"

      - name: Validate signed kernel bundle
        run: |
          set -euo pipefail
          mapfile -t debs < <(find "$KERNEL_BUNDLE_DIR" -maxdepth 1 -type f -name '*.deb' -print | sort)
          [ "${#debs[@]}" -eq 3 ] || {
            echo "::error::Expected kernel, ixgbe and ixgbevf packages; found ${#debs[@]}"
            exit 1
          }

          rm -rf bundle-root
          mkdir bundle-root
          for deb in "${debs[@]}"; do
            [ "$(dpkg-deb --field "$deb" Architecture)" = amd64 ]
            dpkg-deb --showformat='${Package}\t${Version}\t${Architecture}\n' --show "$deb"
            dpkg-deb -x "$deb" bundle-root
          done

          mapfile -t module_dirs < <(find bundle-root/lib/modules -mindepth 1 -maxdepth 1 -type d -print)
          [ "${#module_dirs[@]}" -eq 1 ]
          module_dir="${module_dirs[0]}"
          config="$(find bundle-root/boot -maxdepth 1 -type f -name 'config-*' -print -quit)"
          test -n "$config"
          required=(
            CONFIG_BPF=y
            CONFIG_BPF_SYSCALL=y
            CONFIG_BPF_JIT=y
            CONFIG_CGROUPS=y
            CONFIG_KPROBES=y
            CONFIG_NET_INGRESS=y
            CONFIG_NET_EGRESS=y
            CONFIG_NET_SCH_INGRESS=m
            CONFIG_NET_CLS_BPF=m
            CONFIG_NET_CLS_ACT=y
            CONFIG_BPF_STREAM_PARSER=y
            CONFIG_DEBUG_INFO=y
            CONFIG_DEBUG_INFO_BTF=y
            CONFIG_KPROBE_EVENTS=y
            CONFIG_BPF_EVENTS=y
            CONFIG_MODULE_SIG=y
            CONFIG_MODULE_SIG_FORCE=y
            CONFIG_MODULE_SIG_ALL=y
          )
          for option in "${required[@]}"; do
            grep -Fxq "$option" "$config" || {
              echo "::error::Missing kernel option: $option"
              exit 1
            }
          done
          ! grep -Fxq 'CONFIG_DEBUG_INFO_REDUCED=y' "$config"

          reference_module="$(find "$module_dir/kernel" -type f -name 'dummy.ko*' -print -quit)"
          test -n "$reference_module"
          reference_key="$(modinfo -F sig_key "$reference_module")"
          test -n "$reference_key"
          for name in ixgbe ixgbevf; do
            module="$(find "$module_dir/updates" -type f -name "$name.ko*" -print -quit)"
            test -n "$module" || { echo "::error::$name module missing"; exit 1; }
            signer="$(modinfo -F signer "$module")"
            sig_key="$(modinfo -F sig_key "$module")"
            test -n "$signer"
            [ "$sig_key" = "$reference_key" ] || {
              echo "::error::$name is not signed by the custom kernel key"
              echo "kernel key: $reference_key"
              echo "$name key: $sig_key"
              exit 1
            }
            echo "$name signer: $signer"
            echo "$name sig_key: $sig_key"
          done

          rm -rf bundle-root
          mkdir -p packages
          cp -v "$KERNEL_BUNDLE_DIR"/*.deb packages/

      - name: Save signed kernel bundle
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.KERNEL_BUNDLE_DIR }}
          key: ${{ steps.kernel-cache.outputs.cache-primary-key }}

      - name: Download and validate dae package
        if: inputs.include_dae
        env:
          DAE_VERSION: ${{ inputs.dae_version }}
          DAE_SHA256: ${{ inputs.dae_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$DAE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::dae_version must be an explicit release tag, not latest"
            exit 1
          }
          [[ "$DAE_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::dae_sha256 must be a pinned lowercase SHA-256 digest"
            exit 1
          }

          api_url="https://api.github.com/repos/daeuniverse/dae/releases/tags/$DAE_VERSION"
          release_json="$(mktemp)"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api_url" -o "$release_json"
          [ "$(jq -r '.tag_name' "$release_json")" = "$DAE_VERSION" ]
          asset_url="$(jq -er \
            '[.assets[] | select(.name == "dae-linux-x86_64.deb")][0].browser_download_url' \
            "$release_json")"
          github_digest="$(jq -er \
            '[.assets[] | select(.name == "dae-linux-x86_64.deb")][0].digest' \
            "$release_json")"
          test -n "$asset_url"
          [ "$github_digest" = "sha256:$DAE_SHA256" ] || {
            echo "::error::Pinned dae digest disagrees with GitHub release metadata"
            exit 1
          }
          curl -fL --retry 5 "$asset_url" -o packages/dae-linux-x86_64.deb
          echo "$DAE_SHA256  packages/dae-linux-x86_64.deb" | sha256sum --check --strict
          [ "$(dpkg-deb --field packages/dae-linux-x86_64.deb Package)" = dae ]
          [ "$(dpkg-deb --field packages/dae-linux-x86_64.deb Architecture)" = amd64 ]
          dpkg-deb --contents packages/dae-linux-x86_64.deb | grep -Eq '/usr/bin/dae$'
          dpkg-deb --showformat='${Package}\t${Version}\t${Architecture}\n' \
            --show packages/dae-linux-x86_64.deb

      - name: Build VyOS ISO
        env:
          VERSION_LABEL: ${{ inputs.version_label }}
        run: |
          set -euo pipefail
          rm -rf scripts/package-build/linux-kernel/linux \
            scripts/package-build/linux-kernel/linux-*.tar.xz \
            scripts/package-build/linux-kernel/linux-*.tar.sign
          version="rolling-${VERSION_LABEL}-$(date -u +%Y%m%d%H%M)"
          docker run --rm --privileged \
            --sysctl net.ipv6.conf.lo.disable_ipv6=0 \
            -e GOSU_UID="$(id -u)" -e GOSU_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/vyos" -w /vyos \
            vyos/vyos-build:rolling \
            sudo ./build-vyos-image --architecture amd64 \
              --build-by abramyangCN --build-type development \
              --version "$version" generic

      - name: Verify the built root filesystem
        env:
          INCLUDE_DAE: ${{ inputs.include_dae }}
        run: |
          set -euo pipefail
          test -s build/binary/live/filesystem.squashfs
          sudo rm -rf image-root
          sudo unsquashfs -quiet -no-progress -force -dest image-root \
            build/binary/live/filesystem.squashfs
          mapfile -t module_dirs < <(find image-root/lib/modules \
            -mindepth 1 -maxdepth 1 -type d -print)
          [ "${#module_dirs[@]}" -eq 1 ]
          module_dir="${module_dirs[0]}"
          reference_module="$(find "$module_dir/kernel" -type f \
            -name 'dummy.ko*' -print -quit)"
          reference_key="$(modinfo -F sig_key "$reference_module")"
          test -n "$reference_key"
          kernel_version="$(basename "$module_dir")"
          for name in ixgbe ixgbevf; do
            module="$(find "$module_dir/updates" -type f \
              -name "$name.ko*" -print -quit)"
            test -n "$module"
            test -n "$(modinfo -F signer "$module")"
            [ "$(modinfo -F sig_key "$module")" = "$reference_key" ]
            resolved="$(modinfo -b "$GITHUB_WORKSPACE/image-root" \
              -k "$kernel_version" -n "$name")"
            case "$resolved" in
              */updates/*) ;;
              *) echo "$name resolves to the wrong module: $resolved" >&2; exit 1 ;;
            esac
          done

          admindir="$GITHUB_WORKSPACE/image-root/var/lib/dpkg"
          dpkg-query --admindir="$admindir" -W 'linux-image-*' \
            vyos-intel-ixgbe vyos-intel-ixgbevf
          if [ "$INCLUDE_DAE" = true ]; then
            dpkg-query --admindir="$admindir" -W dae
            test -x image-root/usr/bin/dae
            sudo chroot image-root /usr/bin/dae --version
          else
            if dpkg-query --admindir="$admindir" -W dae 2>/dev/null; then
              echo "Unexpected dae package in dae-ready image" >&2
              exit 1
            fi
          fi

      - name: Prepare artifacts and build report
        env:
          ISO_NAME: ${{ inputs.iso_name }}
          INCLUDE_DAE: ${{ inputs.include_dae }}
        run: |
          set -euo pipefail
          iso=build/live-image-amd64.hybrid.iso
          test -s "$iso"
          sudo cp "$iso" "$ISO_NAME"
          sudo chown "$(id -u):$(id -g)" "$ISO_NAME"
          sha256sum "$ISO_NAME" > "$ISO_NAME.sha256"
          {
            echo "source_commit=$GITHUB_SHA"
            echo "include_dae=$INCLUDE_DAE"
            for deb in packages/*.deb; do
              dpkg-deb --showformat='package=${Package} version=${Version} architecture=${Architecture}\n' --show "$deb"
            done
            echo "iso_sha256=$(sha256sum "$ISO_NAME" | awk '{print $1}')"
          } > build-info.txt
          ls -lh "$ISO_NAME" "$ISO_NAME.sha256" build-info.txt

      - name: Upload verified ISO
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            ${{ inputs.iso_name }}
            ${{ inputs.iso_name }}.sha256
            build-info.txt
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
